name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Lint
        run: bin/rubocop
      - name: Security scan
        run: bin/brakeman --no-pager --exit-on-warn --exit-on-error
      - name: Tests
        run: |
          bin/rails db:prepare
          bin/rails test
